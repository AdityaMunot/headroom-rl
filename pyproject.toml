[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headroom-rl"
version = "0.1.0"
description = "Reads provider rate-limit response headers and gates outgoing requests before they'd 429."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aditya Munot" }]
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/AdityaMunot/headroom-rl"

[tool.hatch.build.targets.wheel]
packages = ["src/headroom_rl"]

[tool.pytest.ini_options]
markers = ["live: hits a real network API, not run by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["headroom_rl"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
